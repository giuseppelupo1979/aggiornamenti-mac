# Test del server su macOS a ogni push e pull request: i comandi di sistema sono simulati,
# nessuna app viene chiusa o aggiornata.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Demo smoke test
        run: |
          AGG_PORT=8799 python server.py --demo &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:8799/api/state | python -c "import json,sys; d=json.load(sys.stdin); sys.exit(d['scanning'] or len(d['items']) < 1)" && break
            sleep 1
          done
          curl -s http://127.0.0.1:8799/ | grep -q Aggiornamenti
