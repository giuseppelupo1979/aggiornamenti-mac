<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aggiornamenti</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f5f9;
    --panel: #ffffff;
    --fg: #192334;
    --muted: #59677a;
    --line: #dce3ed;
    --accent: #175ddc;
    --action: #2465df;
    --accent-fg: #ffffff;
    --ok: #197242;
    --err: #b22b32;
    --amber: #845600;
    --amber-bg: #fff1d9;
    --hover: #edf4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
    --bg: #12151c;
    --panel: #1b2029;
    --fg: #eef2fa;
    --muted: #a9b6cb;
    --line: #303949;
    --accent: #82b1ff;
    --ok: #89d5ab;
    --err: #ff9197;
    --amber: #f1c67b;
    --amber-bg: #3c3020;
    --hover: #202e44;
    }
  }
  :root[data-theme=dark] {
    --bg: #12151c;
    --panel: #1b2029;
    --fg: #eef2fa;
    --muted: #a9b6cb;
    --line: #303949;
    --accent: #82b1ff;
    --ok: #89d5ab;
    --err: #ff9197;
    --amber: #f1c67b;
    --amber-bg: #3c3020;
    --hover: #202e44;
    color-scheme: dark;
  }
  :root[data-theme=light] { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 880px; margin: 0 auto; padding: 0 24px 48px; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 28px 0 24px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .actions { display: flex; gap: 10px; flex-shrink: 0; }

  button {
    font: inherit; font-size: 14px; border-radius: 8px; padding: 10px 16px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
    transition: opacity .15s;
  }
  button:hover:not(:disabled) { background: var(--hover); }
  button.primary { background: var(--action); color: var(--accent-fg); border-color: var(--action); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--action); opacity: .85; }
  button:disabled { opacity: .35; cursor: default; }

  .bar { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .bar label { display: flex; align-items: center; gap: 10px; cursor: pointer; }

  h2 { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 36px 4px 4px; }

  ul { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 20px 36px 1fr auto; align-items: center; gap: 14px; padding: 14px 4px; cursor: pointer; }
  .row:hover { background: var(--hover); }
  .icon { width: 36px; height: 36px; border-radius: 8px; object-fit: contain; }
  .icon.blank { background: var(--line); border-radius: 9px; }
  .icon.term { display: grid; place-items: center; font: 600 15px ui-monospace, "SF Mono", Menlo, monospace; color: var(--fg); background: var(--hover); border: 1px solid var(--line); border-radius: 9px; }
  .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta .arrow { margin: 0 4px; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; margin-left: 8px; vertical-align: 1px; font-weight: 400; }
  .status { font-size: 13px; color: var(--muted); text-align: right; min-width: 80px; }
  .status.done { color: var(--ok); }
  .status.error { color: var(--err); cursor: pointer; }
  li.done .name, li.done .meta { opacity: .5; }

  input[type=checkbox] {
    appearance: none; width: 18px; height: 18px; margin: 0; border: 1.5px solid var(--muted);
    border-radius: 5px; cursor: pointer; display: grid; place-items: center; transition: all .15s;
  }
  input[type=checkbox]:checked { background: var(--action); border-color: var(--action); }
  input[type=checkbox]:checked::after {
    content: ""; width: 5px; height: 9px; border: solid var(--accent-fg); border-width: 0 1.5px 1.5px 0;
    transform: translateY(-1px) rotate(45deg);
  }
  input[type=checkbox]:indeterminate { background: var(--action); border-color: var(--action); }
  input[type=checkbox]:indeterminate::after { content: ""; width: 9px; height: 2px; background: white; }
  input[type=checkbox]:disabled { opacity: .3; cursor: default; }

  .progress { grid-column: 3 / 5; margin-top: -4px; }
  .track { height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; position: relative; }
  .fill { height: 100%; background: var(--action); border-radius: 3px; transition: width .4s ease; }
  .track.indeterminate .fill { width: 30% !important; position: absolute; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }
  .phase { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; justify-content: space-between; gap: 12px; }
  .phase span:last-child { font-variant-numeric: tabular-nums; }
  .overall { margin: 12px 0 24px; }
  .overall .phase { margin-top: 8px; }

  .act { font-size: 12px; color: var(--muted); margin-left: 12px; opacity: 0; transition: opacity .15s; cursor: pointer; }
  .act:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
  .row:hover .act { opacity: 1; }
  @media (hover: none) { .act { opacity: 1; } }
  .row.static { cursor: default; }
  .row.static:hover { background: transparent; }
  details.excluded { margin-top: 48px; }
  details.excluded summary {
    cursor: pointer; list-style: none; font-size: 12px; font-weight: 500; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted); padding: 0 4px 10px; border-bottom: 1px solid var(--line);
  }
  details.excluded summary::-webkit-details-marker { display: none; }
  details.excluded summary::before { content: "›"; display: inline-block; width: 14px; transition: transform .15s; }
  details.excluded[open] summary::before { transform: rotate(90deg); }
  details.excluded summary .muted { text-transform: none; letter-spacing: 0; font-weight: 400; }
  details.excluded .note { color: var(--muted); font-size: 13px; margin: 14px 4px 4px; }

  .settings { margin-top: 14px; display: grid; gap: 10px; max-width: 600px; }
  .opt { display: flex; gap: 12px; align-items: center; color: var(--fg); font-size: 14px; cursor: pointer; }
  .opt input[type=checkbox] { flex-shrink: 0; }
  .opt input[type=time] {
    font: inherit; font-size: 14px; color: var(--fg); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 10px; margin: 0 2px; color-scheme: light dark;
  }
  .hint { margin: 0 0 4px 30px !important; font-size: 13px; }
  .hint:empty { display: none; }
  .hint.warn { color: var(--err); }
  .settings-actions { margin-left: 30px; }
  footer details + details { margin-top: 18px; }
  .version { margin-top: 32px !important; font-size: 12px; }
  .version a { color: var(--muted); }
  .notice {
    display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 16px;
    border: 1px solid var(--line); border-radius: 12px; margin-bottom: 28px; font-size: 14px;
  }
  .notice .meta { white-space: normal; }
  .act.link { opacity: 1; text-decoration: none; }
  .reason { white-space: normal; }
  .act { opacity: 1; background: none; border: 0; padding: 2px 4px; font: inherit; font-size: 12px; color: var(--muted); }
  .row:hover .act, .act:focus-visible { opacity: 1; }
  .act:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .mini { font-size: 12px; padding: 4px 10px; margin-left: 6px; }
  .status .details { color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; margin-left: 6px; }
  .status.blocked, .status.postponed { color: var(--muted); }
  .warn-line { color: var(--err); font-size: 13px; margin: 12px 0 24px; }
  .gone { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: grid; place-items: center; z-index: 20; padding: 16px; }
  .gone .card { background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 32px; max-width: 460px; text-align: center; }
  .gone h2 { font-size: 22px; color: var(--fg); text-transform: none; letter-spacing: 0; margin: 0 0 10px; }
  .gone p { color: var(--muted); margin: 0 0 22px; }
  .history li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 4px; font-size: 13px; color: var(--muted); }
  .notice.self { border-color: var(--fg); }
  .notice .links { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
  .notice .links a { color: var(--muted); font-size: 13px; }
  .notice pre.log { margin: 12px 0 0; }

  pre.log {
    margin: 0 4px 14px 74px; padding: 12px 14px; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--muted); background: var(--hover); border-radius: 8px; white-space: pre-wrap; word-break: break-word;
    max-height: 220px; overflow: auto;
  }

  .spin { display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--line); border-top-color: var(--fg); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }

  .empty { text-align: center; color: var(--muted); padding: 96px 0; }
  .empty strong { display: block; color: var(--fg); font-size: 17px; font-weight: 500; margin-bottom: 6px; }

  footer { margin-top: 56px; color: var(--muted); font-size: 13px; }
  footer details summary { cursor: pointer; list-style: none; }
  footer details summary::-webkit-details-marker { display: none; }
  footer form { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  footer input[type=password] {
    font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--fg); width: 240px; outline: none;
  }
  footer input[type=password]:focus { border-color: var(--muted); }
  footer p { margin: 10px 0 0; max-width: 560px; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; background: var(--muted); }
  .dot.on { background: var(--ok); }

  .apps-panel, details.excluded, footer > details {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: clip;
  }
  .apps-panel .bar { padding: 16px 20px; }
  .apps-panel h2 { padding: 14px 20px 8px; margin: 0; }
  ul { padding: 0; margin: 0; }
  .row { padding: 16px 20px; grid-template-columns: 20px 40px minmax(0, 1fr) auto; }
  li:last-child { border-bottom: 0; }
  li.selected { background: var(--hover); }
  .row:focus-within { box-shadow: inset 3px 0 var(--accent); }
  .icon { width: 40px; height: 40px; background: var(--panel); }
  .name { white-space: normal; overflow-wrap: anywhere; font-weight: 600; }
  .meta { margin-top: 3px; white-space: normal; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .new-version { color: var(--fg); font-weight: 500; }
  .source { display: block; margin-top: 2px; font-size: 12px; }
  .tag { color: var(--amber); background: var(--amber-bg); border: 0; border-radius: 5px; display: inline-block; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; justify-content: flex-end; margin-top: 5px; }
  .row-actions .act { margin: 0; opacity: 1; }
  select { font: inherit; font-size: 13px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); padding: 8px; border-radius: 7px; max-width: 100%; }
  .snooze-select { font-size: 12px; max-width: 180px; padding: 5px; }
  .status { max-width: 230px; }
  .status.restart, .status.unverified, .review-notice { color: var(--amber); }
  .history-result.done { color: var(--ok); }
  .history-result.error { color: var(--err); }
  .history-result.restart, .history-result.unverified { color: var(--amber); }
  .review-notice { padding: 14px 16px; border-radius: 10px; background: var(--amber-bg); font-size: 14px; }
  details.excluded { margin-top: 16px; }
  details.excluded > summary { padding: 16px 20px; border: 0; text-transform: none; font-size: 14px; letter-spacing: 0; }
  details.excluded[open] > summary { border-bottom: 1px solid var(--line); }
  details.excluded .note { margin: 12px 20px; }
  .history-tools { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 20px 0; }
  .history-tools select { flex: 1; min-width: 130px; }
  .history li { display: block; padding: 0 20px; }
  .history li > details { width: 100%; }
  .history li summary { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; font-size: 13px; color: var(--fg); text-transform: none; letter-spacing: 0; }
  .history li summary::before { display: none; }
  .history li p { margin: 8px 0; }
  .history pre.log { margin: 8px 0 16px; }
  footer { margin-top: 28px; }
  footer > details + details { margin-top: 12px; }
  footer > details { padding: 16px 20px; }
  .appearance { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
  .act:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (pointer: coarse) { button, select, summary, .act { min-height: 44px; } }
  @media (max-width: 600px) {
    .progress { grid-column: 1 / 4; }
    main { padding: 0 12px 32px; }
    header { flex-direction: column; align-items: stretch; gap: 14px; padding: 18px 0; }
    h1 { font-size: 26px; }
    .actions button { flex: 1; }
    .row { grid-template-columns: 20px 32px 1fr; }
    .row { padding: 14px 12px; gap: 10px; }
    .icon { width: 32px; height: 32px; }
    .status { grid-column: 3; text-align: left; min-width: 0; max-width: none; }
    .row-actions { justify-content: flex-start; }
    .history li summary { flex-direction: column; gap: 4px; }
    .notice { flex-wrap: wrap; }
    .opt { flex-wrap: wrap; }
    pre.log { margin-left: 4px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" id="sub" role="status"></p>
    </div>
    <div class="actions">
      <button id="scan" data-t="check"></button>
      <button id="go" class="primary" disabled></button>
    </div>
  </header>

  <div id="overall" aria-live="polite"></div>
  <div id="list"></div>

  <footer>
    <details id="settings">
      <summary><span class="dot" id="autodot"></span><span id="autolabel"></span></summary>
      <div class="settings">
        <label class="opt"><input type="checkbox" id="s_daily"> <span><span data-t="dailyA"></span> <input type="time" id="s_check_time" aria-label="Check time"> <span data-t="dailyB"></span></span></label>
        <label class="opt"><input type="checkbox" id="s_auto"> <span><span data-t="nightly"></span> <input type="time" id="s_auto_time" aria-label="Update time"></span></label>
        <p class="hint" data-t="nightlyHint"></p>
        <label class="opt"><input type="checkbox" id="s_ac"><span data-t="onlyAC"></span></label>
        <label class="opt"><input type="checkbox" id="s_metered"><span data-t="avoidMetered"></span></label>
        <p class="hint" data-t="conditionsHint"></p>
        <p class="hint" id="nextauto" role="status"></p>
        <label class="opt"><input type="checkbox" id="s_login"> <span data-t="login"></span></label>
        <p class="hint" id="loginhint"></p>
        <p class="hint" id="lastauto"></p>
        <div class="settings-actions"><button type="button" id="s_test" data-t="testNotif"></button> <button type="button" id="s_clean" data-t="cleanNow"></button></div>
        <p class="hint" id="lastclean"></p>
      </div>
    </details>
    <details>
      <summary><span class="dot" id="pwdot"></span><span id="pwlabel"></span></summary>
      <form id="pwform" autocomplete="off">
        <input type="password" id="pw" autocomplete="new-password" aria-label="Password">
        <button type="submit" data-t="save"></button>
        <button type="button" id="pwdel" data-t="remove"></button>
      </form>
      <p data-t="pwHelp"></p>
      <p id="pwmsg"></p>
    </details>
    <div class="appearance"><label for="s_theme" data-t="appearance"></label><select id="s_theme"><option value="system" data-t="themeSystem"></option><option value="light" data-t="themeLight"></option><option value="dark" data-t="themeDark"></option></select></div>
    <p class="version" id="version"></p>
  </footer>
</main>
<div id="gone"></div>

<script>
const $ = s => document.querySelector(s);
let data = { items: [], jobs: {} };
const selected = new Set();
const openLogs = new Set();
let firstLoad = true;

// ---------------------------------------------------------------- lingue

const I18N = {
  it: {
    title: "Aggiornamenti", check: "Controlla", update: "Aggiorna", updateAll: "Aggiorna tutto", updateN: n => `Aggiorna ${n} app`,
    scanning: "Controllo in corso…", cleaning: "Pulizia della cache…", updating: "Aggiornamento in corso…", error: "Errore: ",
    allUpToDate: "Nessun aggiornamento", noneNeeded: "Nessun aggiornamento disponibile per le app controllate. Quelle che il programma non sa controllare sono in fondo, in Non controllate.",
    interrupt: "Interrompi", stopping: "Mi fermo dopo l'installazione in corso…",
    blocked: "Non si chiude da sola", force: "Forza chiusura", postpone: "Rimanda", postponed: "Rimandata",
    forceConfirm: n => `Chiudere d'autorità ${n}? Eventuali modifiche non salvate in ${n} andranno perse.`,
    details: "Dettagli",
    staleErr: (m, a) => `Controllo non riuscito (${m}). Mostro l'ultimo elenco valido${a ? ", del " + a : ""}.`,
    warns: { brew_update: "Il catalogo Homebrew non si è aggiornato: alcune versioni nuove potrebbero mancare.",
             mas: "L'App Store non ha risposto: i suoi aggiornamenti non sono stati verificati.",
             softwareupdate: "Aggiornamento Software non ha risposto: gli aggiornamenti di macOS non sono stati verificati." },
    goneTitle: "Aggiornamenti è stato chiuso", goneText: "Questa pagina mostra dati non più aggiornati. Per riaprire il programma usa l'app Aggiornamenti sulla Scrivania o il comando aggiornamenti nel Terminale.",
    history: "Storico", actionFailed: "Operazione non riuscita: ",
    quit: "Esci", quitConfirm: "Chiudere Aggiornamenti? Il controllo automatico si ferma finché non lo riapri.",
    quitLater: "Esco appena finisce l'aggiornamento in corso…",
    loginOffHint: "Avvio all'accesso spento: Aggiornamenti funziona solo quando lo apri tu, e con Esci si chiude del tutto.",
    res: { done: "aggiornata", error: "non riuscita", blocked: "non chiusa", postponed: "rimandata" },
    available: n => n === 1 ? "1 aggiornamento disponibile" : `${n} aggiornamenti disponibili`,
    now: "adesso", minAgo: n => `${n} min fa`, of: "di",
    selectAll: "Seleziona tutto", apps: "Applicazioni", cli: "Strumenti da riga di comando",
    done: "Aggiornata", failed: "Non riuscito", queued: "In coda", inProgress: "In corso",
    exclude: "Escludi", include: "Includi", major: "versione maggiore", unverified: "da verificare",
    phases: { prepare: "Preparazione", download: "Download", unpack: "Apertura del pacchetto", verify: "Verifica della firma",
              install: "Installazione", replace: "Sostituzione della versione precedente", finish: "Rifinitura",
              closing: "Chiusura dell'app", reopening: "Riapertura dell'app" },
    sources: { homebrew: "Homebrew", cli: "Riga di comando", appstore: "App Store", developer: "Sito dello sviluppatore" },
    reasons: { no_catalog_version: "Il catalogo Homebrew non indica il numero di versione", no_app_version: "L'app non dichiara la sua versione",
               insecure_feed: "Canale di aggiornamento non sicuro (http)", no_source: "Nessuna fonte di aggiornamento conosciuta",
               feed_down: "Il sito dello sviluppatore non ha risposto", feed_empty: "Il canale di aggiornamento non contiene versioni leggibili" },
    macos: "Aggiornamento di macOS disponibile", openSettings: "Apri Impostazioni",
    excluded: "Escluse", withUpdate: n => `(${n} con aggiornamento)`,
    excludedNote: "Queste app non compaiono nell'elenco principale e non vengono mai selezionate in automatico. Puoi comunque aggiornarle da qui quando serve.",
    noUpdate: "Nessun aggiornamento",
    unchecked: "Non controllate",
    uncheckedNote: "Per queste app non esiste una fonte di aggiornamento che il programma sappia leggere: non è detto che siano aggiornate. Controllale ogni tanto dal menu dell'app o dal sito dello sviluppatore.",
    unknownVersion: "versione sconosciuta", search: "Cerca",
    dailyA: "Controlla ogni giorno alle", dailyB: "e avvisami con una notifica", nightly: "Aggiorna da solo ogni notte alle",
    nightlyHint: "Di notte vengono aggiornate solo le app non escluse, senza versioni maggiori né abbinamenti da verificare. Le app aperte non vengono mai chiuse: si rimandano al giro successivo. Se il Mac è spento o dorme, riprova al risveglio entro cinque ore dall’orario scelto; altrimenti aspetta la notte dopo.",
    login: "Avvia Aggiornamenti all'accesso", testNotif: "Prova una notifica", cleanNow: "Libera spazio ora",
    autoOff: "Controllo automatico disattivato", autoNightly: t => `Aggiornamento automatico ogni notte alle ${t}`, autoDaily: t => `Controllo automatico ogni giorno alle ${t}`,
    loginWarn: "Il controllo automatico funziona solo mentre Aggiornamenti è attivo: attiva l'avvio all'accesso perché resti attivo anche dopo un riavvio.",

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  });

function ago(t) {
  if (!t) return "";
  const s = Math.round(Date.now() / 1000 - t);
  if (s < 60) return L.now;
  if (s < 3600) return L.minAgo(Math.floor(s / 60));
  return new Date(t * 1000).toLocaleString(locale(), { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function size(b) {
  if (!b) return "0 MB";
  return b >= 1073741824 ? (b / 1073741824).toLocaleString(locale(), { maximumFractionDigits: 1 }) + " GB"
    : (b / 1048576).toLocaleString(locale(), { maximumFractionDigits: 0 }) + " MB";
}

function mb(b) { return (b / 1048576).toLocaleString(locale(), { maximumFractionDigits: b < 10485760 ? 1 : 0 }); }

function bar(pct) {
  const ind = pct === null || pct === undefined;
  return `<div class="track${ind ? " indeterminate" : ""}"><div class="fill" style="width:${ind ? 30 : pct > 0 ? Math.max(2, pct) : 0}%"></div></div>`;
}

function jobText(job) {
  if (job.status === "queued") return [L.queued, "", 0];
  let detail = "";
  if (job.bytes) detail = job.total ? `${mb(job.bytes)} ${L.of} ${mb(job.total)} MB` : `${mb(job.bytes)} MB`;
  const known = job.pct !== null && job.pct !== undefined;
  const phase = L.phases[job.phase] || L.inProgress;
  return [phase + (detail ? " · " + detail : ""), known ? `${Math.round(job.pct)}%` : "", known ? job.pct : null];
}

function jobProgress(id, job) {
  const [label, pct, val] = jobText(job);
  return `<div class="progress" data-p="${esc(id)}">${bar(val)}<div class="phase"><span>${esc(label)}</span><span>${pct}</span></div></div>`;
}

// aggiorna le barre già presenti senza ricreare il DOM, così le animazioni restano fluide
function patchProgress() {
  document.querySelectorAll("[data-p]").forEach(el => {
    const job = data.jobs[el.dataset.p];
    if (!job) return;
    const [label, pct, val] = jobText(job);
    const track = el.querySelector(".track");
    const ind = val === null;
    track.classList.toggle("indeterminate", ind);
    track.firstElementChild.style.width = (ind ? 30 : val > 0 ? Math.max(2, val) : 0) + "%";
    const spans = el.querySelectorAll(".phase span");
    spans[0].textContent = label;
    spans[1].textContent = pct;
    const status = el.parentElement.querySelector(".status");
    if (status) status.innerHTML = job.status === "running" && ind ? '<span class="spin"></span>' : "";
  });
}

function renderOverall() {
  const b = data.batch;
  if (!data.running || !b || !b.total || data.cleaning) { $("#overall").innerHTML = ""; return; }
  const cur = Object.values(data.jobs).find(j => j.status === "running");
  const pct = 100 * (b.done + (cur && cur.pct ? cur.pct / 100 : 0)) / b.total;
  if (!$("#overall .overall")) $("#overall").innerHTML = `<div class="overall">${bar(0)}<div class="phase"><span></span><span></span></div></div>`;
  $("#overall .fill").style.width = Math.max(2, pct) + "%";
  const spans = $("#overall").querySelectorAll(".phase span");
  spans[0].textContent = `${Math.min(b.done + 1, b.total)} ${L.of} ${b.total}`;
  spans[1].textContent = `${Math.round(pct)}%`;
}

function rowHtml(i, busy, ex) {
  const job = data.jobs[i.id];
  const st = i.updated ? "done" : job?.status;
  const paused = i.snooze;
  const det = job?.log ? ` <a class="details" data-details="${esc(i.id)}" href="#">${L.details}</a>` : "";
  const status =
    paused ? esc(paused.version ? `${L.skipped}: ${paused.version}` : `${L.until} ${new Date(paused.until * 1000).toLocaleString(locale())}`) :
    ["restart", "unverified", "deferred"].includes(st) ? esc(L.res[st]) + det :
    st === "done" ? L.done + det :
    st === "running" ? (job.pct !== null && job.pct !== undefined ? "" : '<span class="spin"></span>') :
    st === "queued" ? "" :
    st === "error" ? L.failed + det :
    st === "blocked" ? `${L.blocked}${det}<br><button type="button" class="mini" data-force="${esc(i.id)}">${L.force}</button><button type="button" class="mini" data-dismiss="${esc(i.id)}">${L.postpone}</button>` :
    st === "postponed" ? L.postponed + det :
    "";
  const act = busy || st === "running" || st === "queued" || st === "blocked" ? "" :
    `<button type="button" class="act" data-act="${ex ? "include" : "exclude"}">${ex ? L.include : L.exclude}</button>`;
  const postpone = busy || i.updated ? "" : paused
    ? `<button type="button" class="mini" data-resume="${esc(i.id)}">${L.resume}</button>`
    : `<select class="snooze-select" aria-label="${esc(L.snooze + ' ' + i.name)}" data-snooze="${esc(i.id)}"><option value="">${L.snooze}</option><option value="day">${L.day}</option><option value="week">${L.week}</option><option value="version">${L.skipVersion}</option></select>`;
  return `<li class="${st === "done" ? "done" : ""} ${selected.has(i.id) && !paused ? "selected" : ""}">
    <div class="row" data-id="${esc(i.id)}" data-key="${esc(i.key)}">
      <input type="checkbox" aria-label="${esc(i.name)}" ${selected.has(i.id) ? "checked" : ""} ${busy || i.updated || paused ? "disabled" : ""}>
      ${iconHtml(i.path, i.kind, i.name)}
      <div style="min-width:0">
        <div class="name">${esc(i.name)}${i.major ? `<span class="tag">${L.major}</span>` : ""}${i.verified === false ? `<span class="tag">${L.unverified}</span>` : ""}</div>
        <div class="meta">${esc(i.installed)}<span class="arrow">→</span><span class="new-version">${esc(i.latest)}</span><span class="source">${esc(L.sources[i.source] || i.source)}</span></div>
      </div>
      <div class="status ${st || ""}">${status}<div class="row-actions">${postpone}${act}</div></div>
      ${st === "running" || st === "queued" ? jobProgress(i.id, job) : ""}
    </div>
    ${openLogs.has(i.id) && job?.log ? `<pre class="log">${esc(job.log)}</pre>` : ""}
  </li>`;
}

function render() {

  snoozeOpen = $("#list details.snoozed")?.open ?? snoozeOpen;
  unOpen = $("#list details.unchecked")?.open ?? unOpen;
  exOpen = $("#list details.excluded:not(.unchecked):not(.hist):not(.snoozed)")?.open ?? exOpen;
  const historyDetails = new Set([...document.querySelectorAll("[data-history][open]")].map(el => el.dataset.history));
  const busy = data.scanning || data.running;
  const items = data.items;
  const main = items.filter(i => !isEx(i) && !i.snooze);
  const todo = main.filter(i => !i.updated);
  const allPending = pending();

  if (firstLoad && !data.scanning) {
    todo.forEach(i => { if (!i.major && i.verified !== false) selected.add(i.id); });
    firstLoad = false;
  }
  for (const id of [...selected]) if (!allPending.find(i => i.id === id && !i.snooze)) selected.delete(id);

  $("#sub").innerHTML = data.scanning
    ? `<span class="spin"></span>${L.scanning}`
    : data.cleaning ? `<span class="spin"></span>${L.cleaning}`
    : data.self && data.self.status === "updating" ? `<span class="spin"></span>${L.selfUpdating(esc(data.self.available || ""))}`
    : data.self && data.self.status === "restarting" ? `<span class="spin"></span>${L.selfRestarting}`
    : data.quit_after ? `<span class="spin"></span>${L.quitLater}`
    : data.stopping ? `<span class="spin"></span>${L.stopping}`
    : data.running ? L.updating
    : data.scan_error ? esc(L.staleErr(data.scan_error, data.scanned_at ? ago(data.scanned_at) : ""))
    : todo.length === 0 ? `${L.allUpToDate} · ${ago(data.scanned_at)}`
    : `${L.available(todo.length)} · ${ago(data.scanned_at)}`;

  renderOverall();
  $("#scan").disabled = busy;
  const n = selected.size;
  const nMain = todo.filter(i => selected.has(i.id)).length;
  const updatingApps = data.running && data.batch && !data.cleaning && !(data.self && data.self.status);
  // durante un giro il pulsante diventa "Interrompi": finisce l'installazione in corso e salta le altre
  $("#go").disabled = updatingApps ? !!data.stopping : (busy || n === 0);
  $("#go").textContent = updatingApps ? L.interrupt : n ? L.updateN(n) : L.update;

  if (data.version)
    $("#version").innerHTML = `${data.demo ? esc(L.demo) + " · " : ""}${L.version} ${esc(data.version)} · <a href="https://github.com/giuseppelupo1979/aggiornamenti-mac/blob/main/CHANGELOG.md" target="_blank" rel="noopener">${L.news}</a> · <a href="#" class="quit" id="quit">${L.quit}</a>`;
  renderSettings();
  $("#pwdot").className = "dot" + (data.password ? " on" : "");
  $("#pwlabel").textContent = data.password ? L.pwSet : L.pwUnset;

  const sig = JSON.stringify([lang, data.stale, (data.scan_warnings || []).join(), JSON.stringify(data.history || []), historyApp, historyResult, data.self && [data.self.available, data.self.status, selfLogOpen], busy, data.scanning, [...selected], [...openLogs], Object.keys(excluded()), (data.unchecked || []).length, (data.macos || []).join(), items.map(i => {
    const j = data.jobs[i.id];
    return [i.id, i.updated, i.snooze, j?.status, openLogs.has(i.id) ? j?.log : ""];
  })]);
  if (sig === lastSig) return patchProgress();
  lastSig = sig;

  let html = selfBanner();
  if (Object.values(data.jobs).some(j => ["restart", "unverified"].includes(j.status))) html += `<p class="review-notice" role="status">${L.pendingReview}</p>`;
  const warns = data.scan_warnings || [];
  if (!data.scan_error && warns.length)
    html += `<p class="warn-line">${warns.map(w => L.warns[w] || w).join(" ")}</p>`;
  if (data.macos && data.macos.length) {
    html += `<div class="notice"><div><div class="name">${L.macos}</div><div class="meta">${data.macos.map(esc).join(" · ")}</div></div><button type="button" id="openSU">${L.openSettings}</button></div>`;
  }
  if (!main.length) {
    html += data.scanning || data.scan_error ? "" : `<div class="empty"><strong>${L.allUpToDate}</strong>${items.some(i => i.snooze || isEx(i)) ? L.noEligible : L.noneNeeded}</div>`;
  } else {
    html += `<section class="apps-panel"><div class="bar"><label><input type="checkbox" id="all" ${todo.length && nMain === todo.length ? "checked" : ""} ${busy || !todo.length ? "disabled" : ""}> ${L.selectAll}</label><span>${nMain} ${L.of} ${todo.length}</span></div>`;
    const groups = [
      [L.apps, main.filter(i => i.kind !== "formula")],
      [L.cli, main.filter(i => i.kind === "formula")],
    ].filter(g => g[1].length);
    for (const [title, list] of groups) {
      html += `<h2>${title}</h2><ul>${list.map(i => rowHtml(i, busy, false)).join("")}</ul>`;
    }
    html += "</section>";
  }
  const snoozed = items.filter(i => i.snooze && !isEx(i));
  if (snoozed.length) html += `<details class="excluded snoozed" ${snoozeOpen ? "open" : ""}><summary>${L.snoozed} · ${snoozed.length}</summary><ul>${snoozed.map(i => rowHtml(i, busy, false)).join("")}</ul></details>`;

  // sezione separata: app escluse dalla verifica
  const ex = Object.entries(excluded()).sort((a, b) => a[1].name.localeCompare(b[1].name));
  if (ex.length) {
    const withUpdate = ex.filter(([k]) => items.some(i => i.key === k && !i.updated)).length;
    html += `<details class="excluded" ${exOpen ? "open" : ""}>
      <summary>${L.excluded} · ${ex.length}${withUpdate ? ` <span class="muted">${L.withUpdate(withUpdate)}</span>` : ""}</summary>
      <p class="note">${L.excludedNote}</p><ul>`;
    for (const [key, info] of ex) {
      const it = items.find(i => i.key === key);
      if (it) { html += rowHtml(it, busy, true); continue; }
      html += `<li><div class="row static" data-key="${esc(key)}">
        <span></span>${iconHtml(info.path, info.kind)}
        <div style="min-width:0"><div class="name">${esc(info.name)}</div><div class="meta">${data.scanning ? L.scanning : L.noUpdate}</div></div>
        <div class="status">${busy ? "" : `<button type="button" class="act" data-act="include">${L.include}</button>`}</div>
      </div></li>`;
    }
    html += "</ul></details>";
  }

  // app che nessuna fonte sa controllare
  const un = data.unchecked || [];
  if (un.length && !data.scanning) {
    html += `<details class="excluded unchecked" ${unOpen ? "open" : ""}>
      <summary>${L.unchecked} · ${un.length}</summary>
      <p class="note">${L.uncheckedNote}</p><ul>`;
    for (const u of un) {
      const q = encodeURIComponent(`${u.name} mac download`);
      html += `<li><div class="row static">
        <span></span>${iconHtml(u.path)}
        <div style="min-width:0"><div class="name">${esc(u.name)}</div><div class="meta reason">${esc(u.version || L.unknownVersion)} · ${esc(L.reasons[u.reason] || u.reason)}</div></div>
        <div class="status"><a class="act link" href="https://duckduckgo.com/?q=${q}" target="_blank" rel="noopener">${L.search}</a></div>
      </div></li>`;
    }
    html += "</ul></details>";
  }
  const hist = (data.history || []).slice().reverse();
  html += `<details class="excluded hist" ${histOpen ? "open" : ""}><summary>${L.history} · ${hist.length}</summary>
    <div class="history-tools"><select id="history-app" aria-label="${L.apps}"><option value="">${L.allApps}</option>${[...new Set(hist.map(h => h.name))].sort().map(n => `<option ${historyApp === n ? "selected" : ""} value="${esc(n)}">${esc(n)}</option>`).join("")}</select>
    <select id="history-result" aria-label="${L.allResults}"><option value="">${L.allResults}</option>${Object.entries(L.res).map(([k,v]) => `<option value="${k}" ${historyResult === k ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>
    <button id="export-report" type="button">${L.exportReport}</button></div><p class="note">${L.reportHint}</p><ul class="history">`;
  const filtered = hist.filter(h => (!historyApp || h.name === historyApp) && (!historyResult || h.result === historyResult));
  if (!filtered.length) html += `<li>${L.noHistory}</li>`;
  for (const h of filtered) html += `<li><details data-history="${esc(h.at + ':' + h.name)}" ${historyDetails.has(h.at + ':' + h.name) ? "open" : ""}><summary><span>${esc(h.name)}</span><span class="history-result ${esc(h.result)}">${esc(L.res[h.result] || h.result)} · ${ago(h.at)}</span></summary>
    <p>${esc(h.from || "?")} → ${esc(h.to || "?")} · ${L.detected}: ${esc(h.observed || "?")}<br>${L.exitCode}: ${esc(h.exit_code ?? "—")} · ${L.schedule}: ${esc(h.mode || "—")}</p>${h.log ? `<pre class="log">${esc(h.log)}</pre>` : ""}</details></li>`;
  html += "</ul></details>";
  const focus = document.activeElement;
  const focusId = focus?.id;
  const focusRow = focus?.closest(".row")?.dataset.id;
  const focusAttr = ["data-act", "data-details", "data-snooze", "data-resume", "data-force", "data-dismiss"].find(k => focus?.hasAttribute(k));
  const focusValue = focusAttr && focus.getAttribute(focusAttr);
  $("#list").innerHTML = html;
  let restored = focusId ? document.getElementById(focusId) : focusRow
    ? [...document.querySelectorAll(".row")].find(r => r.dataset.id === focusRow)?.querySelector(focusAttr ? `[${focusAttr}]` : "input") : null;
  if (restored && (!focusAttr || restored.getAttribute(focusAttr) === focusValue)) restored.focus({preventScroll:true});
  if (!restored && focusRow && ["data-snooze", "data-resume"].includes(focusAttr)) {
    restored = [...document.querySelectorAll("[data-snooze], [data-resume]")].find(el => el.dataset.snooze === focusRow || el.dataset.resume === focusRow);
    restored?.focus({preventScroll:true});
  }
  const allBox = $("#all");
  if (allBox) allBox.indeterminate = nMain > 0 && nMain < todo.length;

}

$("#list").addEventListener("change", async e => {
  if (e.target.id === "history-app") { historyApp = e.target.value; return render(); }
  if (e.target.id === "history-result") { historyResult = e.target.value; return render(); }
  if (e.target.matches("[data-snooze]") && e.target.value) {
    selected.delete(e.target.dataset.snooze);
    return act("/api/snooze", {id:e.target.dataset.snooze, choice:e.target.value});
  }
});
$("#list").addEventListener("click", async e => {
  if (e.target.id === "export-report") {
    try {
      const report = await api("/api/diagnostics");
      const url = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], {type:"application/json"}));
      const link = document.createElement("a"); link.href = url; link.download = "aggiornamenti-diagnostica.json"; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (err) { alert(L.actionFailed + err.message); }
    return;
  }
  if (e.target.closest("select, .hist")) return;
  const resume = e.target.closest("[data-resume]");
  if (resume) return act("/api/snooze", {id:resume.dataset.resume, choice:"resume"});
  if (e.target.id === "openSU") return api("/api/open-software-update", {});
  if (e.target.id === "selfInstall") {
    try { data = await api("/api/self-update", {}); } catch (err) { alert(err.message); }
    return render();
  }
  if (e.target.id === "selfLogToggle") { e.preventDefault(); selfLogOpen = !selfLogOpen; return render(); }
  if (e.target.id === "all") {
    const main = pending().filter(i => !isEx(i) && !i.snooze);
    if (e.target.checked) main.forEach(i => selected.add(i.id)); else main.forEach(i => selected.delete(i.id));
    return render();
  }
  const d = e.target.closest("[data-details]");
  if (d) { e.preventDefault(); const id = d.dataset.details; openLogs.has(id) ? openLogs.delete(id) : openLogs.add(id); return render(); }
  const f = e.target.closest("[data-force]");
  if (f) {
    const it = data.items.find(i => i.id === f.dataset.force);
    if (!confirm(L.forceConfirm(it ? it.name : ""))) return;
    return act("/api/force", { id: f.dataset.force });
  }
  const dm = e.target.closest("[data-dismiss]");
  if (dm) return act("/api/dismiss", { id: dm.dataset.dismiss });
  const actEl = e.target.closest("[data-act]");
  if (actEl) {
    e.stopPropagation();
    const row = actEl.closest(".row");
    const key = row.dataset.key;
    const exclude = actEl.dataset.act === "exclude";
    const it = data.items.find(i => i.key === key);
    if (exclude && it) selected.delete(it.id);
    return act("/api/exclude", { key, exclude, name: it?.name, path: it?.path, kind: it?.kind });
  }
  const row = e.target.closest(".row");
  if (!row || row.classList.contains("static")) return;
  const id = row.dataset.id;
  // la colonna di stato ha i suoi comandi: non seleziona la riga
  if (e.target.closest(".status")) return;
  const cb = row.querySelector("input");
  if (cb.disabled) return;
  selected.has(id) ? selected.delete(id) : selected.add(id);
  render();
});

// ogni azione mostra l'errore invece di fallire in silenzio
async function act(path, body) {
  try { data = await api(path, body); }
  catch (err) { alert(L.actionFailed + (err.message === "Failed to fetch" || err.message === "Load failed" ? L.goneTitle : err.message)); }
  render();
}
$("#scan").onclick = () => { firstLoad = true; return act("/api/scan", {}); };
$("#go").onclick = () => {
  if (data.running && data.batch) return act("/api/stop", {});
  return act("/api/update", { ids: [...selected] });
};
$("#version").addEventListener("click", e => {
  if (e.target.id !== "quit") return;
  e.preventDefault();
  if (confirm(L.quitConfirm)) act("/api/quit", {});
});

$("#pwform").onsubmit = async e => {
  e.preventDefault();
  const pw = $("#pw").value;
  if (!pw) return;
  $("#pwmsg").textContent = L.pwChecking;
  try { data = await api("/api/password", { password: pw }); $("#pwmsg").textContent = L.pwSaved; }
  catch (err) { $("#pwmsg").textContent = err.message; }
  $("#pw").value = "";
  render();
};
$("#pwdel").onclick = async () => {
  data = await api("/api/password", { password: "" });
  $("#pwmsg").textContent = L.pwRemoved;
  render();
};

applyStatic();
let langFromServer = false;
let startVersion = null;
let offline = 0;
async function poll() {
  try {
    data = await api("/api/state");
    // dopo l'aggiornamento di sé stesso il server riparte con un'altra versione: si ricarica la pagina
    if (startVersion && data.version !== startVersion) return location.reload();
    startVersion = startVersion || data.version;
    // la lingua del Mac (dal server) prevale su quella del browser
    if (!langFromServer && data.lang) { setLang(data.lang); applyStatic(); langFromServer = true; }
    offline = 0;
    // Esci: il programma avvisa prima di chiudersi; se viene riaperto la pagina torna da sola
    if (data.quitting) showGone();
    else { $("#gone").innerHTML = ""; render(); }
  } catch {
    // il programma non risponde più (chiuso con Esci o fermato): mai una pagina che sembra
    // funzionare con dati vecchi
    offline++;
    if (offline >= 2 && !(data.self && data.self.status === "restarting")) showGone();
  }
  const selfBusy = data.self && (data.self.status === "updating" || data.self.status === "restarting");
  setTimeout(poll, data.running || selfBusy ? 500 : data.scanning ? 1000 : 3000);
}
function showGone() {
  if ($("#gone").innerHTML) return;
  $("#gone").innerHTML = `<div class="gone" role="alertdialog" aria-labelledby="goneT"><div class="card">
    <h2 id="goneT">${L.goneTitle}</h2><p>${L.goneText}</p></div></div>`;
}
poll();
</script>
